<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="홍삼 먹기 전 전문가와 먼저 상의할 사람">
<rect width="800" height="450" rx="20" fill="#fffbeb"/>
<text x="40" y="62" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="800" fill="#7f1d1d">시간보다 먼저 확인할 것</text>
<text x="40" y="94" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#6b7280">식약처 안내·식품안전나라 원료 정보 기준</text>
<g transform="translate(40 120)"><rect width="720" height="62" rx="14" fill="#fff"/><rect width="720" height="62" rx="14" fill="none" stroke="#fecaca" stroke-width="2"/><circle cx="34" cy="31" r="14" fill="#f59e0b"/><text x="34" y="38" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#fff">!</text><text x="64" y="39" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#1f2937">당뇨 치료제를 복용 중이다 → 의사·약사와 상담</text></g>
<g transform="translate(40 194)"><rect width="720" height="62" rx="14" fill="#fff"/><rect width="720" height="62" rx="14" fill="none" stroke="#fecaca" stroke-width="2"/><circle cx="34" cy="31" r="14" fill="#f59e0b"/><text x="34" y="38" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#fff">!</text><text x="64" y="39" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#1f2937">혈액 항응고제(와파린 등)를 복용 중이다 → 상담</text></g>
<g transform="translate(40 268)"><rect width="720" height="62" rx="14" fill="#fff"/><rect width="720" height="62" rx="14" fill="none" stroke="#fecaca" stroke-width="2"/><circle cx="34" cy="31" r="14" fill="#f59e0b"/><text x="34" y="38" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#fff">!</text><text x="64" y="39" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#1f2937">임신 중이거나 알레르기 체질이다 → 먼저 확인</text></g>
<g transform="translate(40 342)"><rect width="720" height="62" rx="14" fill="#fff"/><rect width="720" height="62" rx="14" fill="none" stroke="#fecaca" stroke-width="2"/><circle cx="34" cy="31" r="14" fill="#f59e0b"/><text x="34" y="38" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#fff">!</text><text x="64" y="39" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#1f2937">먹고 이상 반응이 있다 → 중단하고 상담</text></g>
</svg>