<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="수능 전날부터 당일까지 식사 타임라인">
<rect width="800" height="450" rx="20" fill="#f0fdf4"/>
<text x="40" y="58" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="800" fill="#14532d">수능 전날~당일 식사 타임라인</text><text x="40" y="90" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="500" fill="#6b7280">※ 소셜타임스가 정리한 식약처 등 수험생 식사 조언을 시간 순으로 배치</text><line x1="110" y1="140" x2="110" y2="420" stroke="#16a34a" stroke-width="6"/><circle cx="110" cy="150" r="16" fill="#16a34a"/><text x="150" y="146" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#14532d">전날 저녁</text><text x="150" y="174" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="500" fill="#374151">취침 2~3시간 전에 먹고, 평소 양의 70~80% 정도</text><circle cx="110" cy="230" r="16" fill="#16a34a"/><text x="150" y="226" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#14532d">기상</text><text x="150" y="254" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="500" fill="#374151">시험 시작 최소 2시간 전에 일어나기</text><circle cx="110" cy="310" r="16" fill="#16a34a"/><text x="150" y="306" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#14532d">당일 아침</text><text x="150" y="334" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="500" fill="#374151">빵·시리얼보다 밥과 반찬, 평소 먹던 메뉴</text><circle cx="110" cy="390" r="16" fill="#16a34a"/><text x="150" y="386" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#14532d">점심</text><text x="150" y="414" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="500" fill="#374151">보온 도시락을 2시간 안에, 쉬는 시간엔 소량 간식</text>
</svg>
