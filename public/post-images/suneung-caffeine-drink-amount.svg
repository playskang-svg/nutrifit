<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="음료별 1회 카페인 함량 막대 그래프">
<rect width="800" height="460" rx="20" fill="#fff7ed"/>
<text x="40" y="60" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="800" fill="#7c2d12">음료 1회 분량 카페인 (식약처 조사)</text><text x="40" y="92" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="500" fill="#6b7280">※ 용량 기준이 다르니 오른쪽 mg와 아래 표기를 함께 보세요</text><g transform="translate(40 116)"><text x="0" y="30" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#111827">녹차 티백 1개</text><rect x="250" y="6" width="63" height="34" rx="9" fill="#fdba74"/><text x="325" y="32" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#7c2d12">22mg</text></g><g transform="translate(40 170)"><text x="0" y="30" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#111827">콜라 250mL</text><rect x="250" y="6" width="78" height="34" rx="9" fill="#fdba74"/><text x="340" y="32" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#7c2d12">27mg</text></g><g transform="translate(40 224)"><text x="0" y="30" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#111827">커피우유 200mL</text><rect x="250" y="6" width="135" height="34" rx="9" fill="#fdba74"/><text x="397" y="32" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#7c2d12">47mg</text></g><g transform="translate(40 278)"><text x="0" y="30" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#111827">에너지음료 250mL</text><rect x="250" y="6" width="230" height="34" rx="9" fill="#f97316"/><text x="492" y="32" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#7c2d12">80mg</text></g><g transform="translate(40 332)"><text x="0" y="30" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#111827">커피음료 250mL</text><rect x="250" y="6" width="297" height="34" rx="9" fill="#f97316"/><text x="559" y="32" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#7c2d12">103mg</text></g><g transform="translate(40 386)"><text x="0" y="30" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#111827">전문점 커피 400mL</text><rect x="250" y="6" width="380" height="34" rx="9" fill="#f97316"/><text x="642" y="32" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#7c2d12">132mg</text></g>
