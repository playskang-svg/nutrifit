<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="홍삼 기능성별 진세노사이드 일일섭취량">
<rect width="800" height="450" rx="20" fill="#fff7f5"/>
<text x="40" y="60" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="800" fill="#7f1d1d">홍삼 기능성별 진세노사이드 일일섭취량</text>
<text x="40" y="92" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#6b7280">Rg1+Rb1+Rg3 합계 기준 · 식약처 안내(2021.9) · 0~80mg 눈금</text>
<rect x="120" y="160" width="560" height="26" rx="13" fill="#e5e7eb"/><rect x="141" y="160" width="539" height="26" rx="13" fill="#ef4444"/><text x="120" y="150" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#1f2937">면역력 증진 · 피로개선에 도움을 줄 수 있음 : 3~80mg</text><text x="690" y="180" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#7f1d1d" text-anchor="start"></text>
<rect x="120" y="250" width="560" height="26" rx="13" fill="#e5e7eb"/><rect x="137" y="250" width="543" height="26" rx="13" fill="#f97316"/><text x="120" y="240" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#1f2937">혈액흐름 · 기억력 개선 · 항산화 : 2.4~80mg</text><text x="690" y="270" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#7f1d1d" text-anchor="start"></text>
<rect x="120" y="340" width="560" height="26" rx="13" fill="#e5e7eb"/><rect x="295" y="340" width="385" height="26" rx="13" fill="#b91c1c"/><text x="120" y="330" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#1f2937">갱년기 여성의 건강 : 25~80mg</text><text x="690" y="360" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="800" fill="#7f1d1d" text-anchor="start"></text>
<text x="120" y="395" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" fill="#6b7280">0</text><text x="400" y="395" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" fill="#6b7280" text-anchor="middle">40</text><text x="680" y="395" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" fill="#6b7280" text-anchor="end">80mg</text>
<text x="40" y="430" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#374151">제품 라벨의 1일 섭취량과 진세노사이드 mg을 먼저 보세요</text>
</svg>