<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="내게 맞는 홍삼 시간대 찾는 3단계">
<rect width="800" height="450" rx="20" fill="#fff7f5"/>
<text x="40" y="62" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="800" fill="#7f1d1d">내게 맞는 홍삼 시간대, 1주일 3단계</text>
<text x="40" y="96" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#6b7280">'몇 시에 먹어야 한다'는 공식 규정은 확인하지 못했습니다</text>
<g transform="translate(40 130)"><rect width="230" height="230" rx="18" fill="#fff"/><rect width="230" height="230" rx="18" fill="none" stroke="#fca5a5" stroke-width="3"/><circle cx="40" cy="44" r="24" fill="#b91c1c"/><text x="40" y="53" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="800" fill="#fff">1</text><text x="20" y="108" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="800" fill="#1f2937">시간을 고정</text><text x="20" y="140" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4b5563">아침 식후 등 한 시간대로</text><text x="20" y="168" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4b5563">3~4일 같게 먹어 봅니다</text></g>
<g transform="translate(285 130)"><rect width="230" height="230" rx="18" fill="#fff"/><rect width="230" height="230" rx="18" fill="none" stroke="#fca5a5" stroke-width="3"/><circle cx="40" cy="44" r="24" fill="#b91c1c"/><text x="40" y="53" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="800" fill="#fff">2</text><text x="20" y="108" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="800" fill="#1f2937">몸 반응 기록</text><text x="20" y="140" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4b5563">속 편함·수면·두근거림</text><text x="20" y="168" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4b5563">메모장에 한 줄씩</text></g>
<g transform="translate(530 130)"><rect width="230" height="230" rx="18" fill="#fff"/><rect width="230" height="230" rx="18" fill="none" stroke="#fca5a5" stroke-width="3"/><circle cx="40" cy="44" r="24" fill="#b91c1c"/><text x="40" y="53" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="800" fill="#fff">3</text><text x="20" y="108" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="800" fill="#1f2937">불편하면 조정</text><text x="20" y="140" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4b5563">시간을 옮기거나 중단</text><text x="20" y="168" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" fill="#4b5563">계속되면 전문가 상담</text></g>
<text x="40" y="410" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="700" fill="#374151">이상사례는 1577-2488(건강기능식품 이상사례 신고센터)</text>
</svg>