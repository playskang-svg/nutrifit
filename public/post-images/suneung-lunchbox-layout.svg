<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="수능 도시락 칸별 구성 예시 밥 국 단백질 채소">
<rect width="800" height="470" rx="20" fill="#fffbeb"/>
<text x="40" y="58" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="800" fill="#7c2d12">수능 도시락 구성 예시 (칸 나누기)</text><text x="40" y="90" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="500" fill="#6b7280">※ 식약처·농진청 등이 보도에서 소개한 메뉴를 칸별로 배치한 예시</text><rect x="40" y="120" width="350" height="110" rx="18" fill="#fde68a"/><text x="64" y="160" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#78350f">밥</text><text x="64" y="194" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#111827">잡곡밥 또는 흰쌀밥</text><text x="64" y="220" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#4b5563">평소 먹던 쪽</text><rect x="410" y="120" width="350" height="110" rx="18" fill="#fecaca"/><text x="434" y="160" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#7f1d1d">국</text><text x="434" y="194" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#111827">소고기 무국</text><text x="434" y="220" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#4b5563">따뜻하게 보온</text><rect x="40" y="250" width="350" height="110" rx="18" fill="#bfdbfe"/><text x="64" y="290" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#1e3a8a">단백질</text><text x="64" y="324" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#111827">계란볶음밥·장조림</text><text x="64" y="350" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#4b5563">기름기 적게</text><rect x="410" y="250" width="350" height="110" rx="18" fill="#bbf7d0"/><text x="434" y="290" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#14532d">채소</text><text x="434" y="324" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#111827">콩나물·시금치 나물</text><text x="434" y="350" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="500" fill="#4b5563">간은 약하게</text><rect x="40" y="380" width="720" height="56" rx="14" fill="#fff"/><text x="400" y="416" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" fill="#7c2d12">후식: 한 입 크기 귤·사과 · 간식: 초콜릿·견과류 소량</text>
</svg>
