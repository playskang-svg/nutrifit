<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="수능 30일 전 컨디션 관리 순서">
<rect width="800" height="450" rx="20" fill="#ecfdf5"/>
<text x="40" y="60" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="800" fill="#065f46">수능까지 30일, 컨디션 정리 순서</text><text x="40" y="92" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="500" fill="#6b7280">작성자 정리 기준 · 2026년 11월 19일(목) 시행</text><g transform="translate(40 118)"><rect width="720" height="66" rx="14" fill="#fff" stroke="#a7f3d0" stroke-width="2"/><rect width="150" height="66" rx="14" fill="#10b981"/><text x="75" y="41" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#fff">지금~D-21</text><text x="170" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#1f2937">수면·기상 시간 고정, 카페인은 낮 시간 1회로 줄이기</text></g><g transform="translate(40 196)"><rect width="720" height="66" rx="14" fill="#fff" stroke="#a7f3d0" stroke-width="2"/><rect width="150" height="66" rx="14" fill="#10b981"/><text x="75" y="41" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#fff">D-20~D-8</text><text x="170" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#1f2937">새 음식·새 건강기능식품 시작 금지, 평소 식단 유지</text></g><g transform="translate(40 274)"><rect width="720" height="66" rx="14" fill="#fff" stroke="#a7f3d0" stroke-width="2"/><rect width="150" height="66" rx="14" fill="#10b981"/><text x="75" y="41" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#fff">D-7~전날</text><text x="170" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#1f2937">아침 식사와 시험장 점심 메뉴를 미리 연습</text></g><g transform="translate(40 352)"><rect width="720" height="66" rx="14" fill="#fff" stroke="#a7f3d0" stroke-width="2"/><rect width="150" height="66" rx="14" fill="#10b981"/><text x="75" y="41" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#fff">수능 당일</text><text x="170" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#1f2937">처음 마시는 음료·약·영양제는 가져가지 않기</text></g>
</svg>
