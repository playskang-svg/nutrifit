<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="카페인 음료 대신 할 수 있는 4가지">
<rect width="800" height="450" rx="20" fill="#f5f3ff"/>
<text x="40" y="60" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="800" fill="#4c1d95">카페인 음료 대신 이렇게</text><text x="40" y="92" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="500" fill="#6b7280">식약처 카페인 줄이기 요령 + 작성자 정리</text><g transform="translate(40 118)"><rect width="720" height="66" rx="14" fill="#fff" stroke="#ddd6fe" stroke-width="2"/><circle cx="34" cy="33" r="16" fill="#8b5cf6"/><text x="34" y="40" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#fff">1</text><text x="70" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#4c1d95">졸리면</text><text x="230" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#1f2937">물 한 컵, 자리에서 일어나 스트레칭</text></g><g transform="translate(40 196)"><rect width="720" height="66" rx="14" fill="#fff" stroke="#ddd6fe" stroke-width="2"/><circle cx="34" cy="33" r="16" fill="#8b5cf6"/><text x="34" y="40" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#fff">2</text><text x="70" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#4c1d95">목이 마르면</text><text x="230" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#1f2937">카페인 없는 보리차·물</text></g><g transform="translate(40 274)"><rect width="720" height="66" rx="14" fill="#fff" stroke="#ddd6fe" stroke-width="2"/><circle cx="34" cy="33" r="16" fill="#8b5cf6"/><text x="34" y="40" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#fff">3</text><text x="70" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#4c1d95">야식이 당기면</text><text x="230" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#1f2937">과일·견과류 한 줌</text></g><g transform="translate(40 352)"><rect width="720" height="66" rx="14" fill="#fff" stroke="#ddd6fe" stroke-width="2"/><circle cx="34" cy="33" r="16" fill="#8b5cf6"/><text x="34" y="40" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="800" fill="#fff">4</text><text x="70" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800" fill="#4c1d95">잠이 모자라면</text><text x="230" y="41" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="700" fill="#1f2937">음료 말고 취침 시간 앞당기기</text></g>
</svg>
