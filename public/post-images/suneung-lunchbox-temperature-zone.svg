<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="도시락 온도 위험 구간 5도 60도 식중독 기준">
<rect width="800" height="440" rx="20" fill="#eff6ff"/>
<text x="40" y="58" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="30" font-weight="800" fill="#1e3a8a">도시락 온도 위험 구간 (식약처 기준)</text><text x="40" y="90" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="500" fill="#6b7280">※ 5~60℃는 식중독균이 늘기 쉬운 위험온도대로 안내됨</text><rect x="40" y="130" width="130" height="90" rx="12" fill="#bfdbfe"/><text x="105" y="168" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="800" fill="#1e3a8a">5℃ 이하</text><text x="105" y="200" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="600" fill="#1e3a8a">차가운 음식</text><rect x="170" y="130" width="440" height="90" fill="#fecaca"/><text x="390" y="168" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="800" fill="#7f1d1d">5~60℃ 위험온도대</text><text x="390" y="200" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="600" fill="#7f1d1d">32~43℃에서 증식이 가장 활발</text><rect x="610" y="130" width="150" height="90" rx="12" fill="#bbf7d0"/><text x="685" y="168" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="800" fill="#14532d">60℃ 이상</text><text x="685" y="200" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="600" fill="#14532d">따뜻한 음식</text><rect x="40" y="260" width="720" height="150" rx="16" fill="#fff"/><text x="70" y="305" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#111827">· 구입·조리 후 2시간 안에 먹기 (식약처 도시락 안내)</text><text x="70" y="348" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#111827">· 따뜻한 반찬은 60℃ 이상, 차가운 반찬은 5℃ 이하로 나눠 담기</text><text x="70" y="391" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="800" fill="#111827">· 다시 데워 먹을 땐 75℃ 이상 충분히 가열</text>
</svg>
