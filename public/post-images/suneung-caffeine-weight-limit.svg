un Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#111827">70kg</text><rect x="90" y="8" width="480" height="44" rx="10" fill="#93c5fd"/><text x="584" y="40" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="800" fill="#1e3a8a">175mg</text></g><text x="40" y="432" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="700" fill="#b45309">에너지음료(250mL) 1캔 약 80mg → 60kg은 2캔(160mg)이면 150mg 초과</text>
