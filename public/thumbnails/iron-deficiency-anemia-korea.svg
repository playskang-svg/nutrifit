<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="철 저장고가 먼저 빈다">
  <defs>
    <linearGradient id="bgfe" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#450a0a"/><stop offset="0.6" stop-color="#7f1d1d"/><stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgfe)"/>
  <g transform="translate(94 148)">
    <path d="M0-64C24-30 42-12 42 12A42 42 0 1 1-42 12C-42-12-24-30 0-64z" fill="url(#drop)"/>
    <ellipse cx="-13" cy="4" rx="11" ry="16" fill="#fee2e2" opacity="0.45"/>
    <text x="0" y="20" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="28" font-weight="800" fill="#450a0a">Fe</text>
  </g>
  <!-- 저장철(페리틴)이 먼저 비고, 혈색소는 나중에 떨어진다 -->
  <g transform="translate(196 96)">
    <text x="0" y="0" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fecaca">저장철 (페리틴)</text>
    <rect y="10" width="164" height="20" rx="10" fill="#1c1917" opacity="0.7"/>
    <rect y="10" width="30" height="20" rx="10" fill="#f87171"/>
    <text x="0" y="66" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fecaca">혈색소</text>
    <rect y="76" width="164" height="20" rx="10" fill="#1c1917" opacity="0.7"/>
    <rect y="76" width="140" height="20" rx="10" fill="#fbbf24"/>
    <text x="0" y="126" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" fill="#fde68a">"빈혈 없음" = 충분함이 아니다</text>
  </g>
</svg>
