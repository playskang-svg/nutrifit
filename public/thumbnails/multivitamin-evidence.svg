<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="종합비타민 근거 논쟁">
  <defs>
    <linearGradient id="bgmv" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.6" stop-color="#1e293b"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgmv)"/>
  <!-- 근거가 갈리는 주제라 저울로 그린다. 한쪽으로 기울이지 않는다 -->
  <g transform="translate(200 96)" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="0" y1="-22" x2="0" y2="104"/>
    <line x1="-118" y1="-10" x2="118" y2="-10"/>
    <path d="M-46 104h92"/>
  </g>
  <circle cx="200" cy="88" r="9" fill="#e2e8f0"/>
  <g transform="translate(82 86)">
    <path d="M-38 0h76l-38 44z" fill="#475569"/>
    <rect x="-40" y="-4" width="80" height="7" rx="3.5" fill="#94a3b8"/>
    <text y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" fill="#cbd5e1">예방 효과</text>
    <text y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#94a3b8">근거 부족</text>
  </g>
  <g transform="translate(318 86)">
    <path d="M-38 0h76l-38 44z" fill="#0f766e"/>
    <rect x="-40" y="-4" width="80" height="7" rx="3.5" fill="#5eead4"/>
    <text y="72" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="800" fill="#99f6e4">결핍 보충</text>
    <text y="92" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#5eead4">근거 있음</text>
  </g>
  <text x="200" y="266" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#cbd5e1" opacity="0.9">"효과 없다"와 "필요 없다"는 다른 말</text>
</svg>
