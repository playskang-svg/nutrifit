# ⚠ 중앙 저장소 템플릿에서 생성됩니다. 여기서 고치지 마세요.
name: agents-publish (뉴트리핑)

on:
  schedule:
    - cron: "30 22 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "초안만 만들고 발행하지 않음"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: agents-nutrifit
  cancel-in-progress: false

jobs:
  publish:
    if: vars.AGENTS_ENABLED != 'false' && vars.AUTOPUBLISH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_KEY: nutrifit
      AGENTS_DIR: ${{ github.workspace }}/_agents
      AGENT_STATE_DIR: ${{ github.workspace }}/.fleet/state
      SITE_DIR: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 체크아웃 경로 제외
        run: echo "_agents/" >> .git/info/exclude

      - name: 에이전트 원본 가져오기
        uses: actions/checkout@v4
        with:
          repository: playskang-svg/adbles-agents
          path: _agents
          ssh-key: ${{ secrets.AGENTS_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 자격증명 주입
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: node "$AGENTS_DIR/runner/inject-credentials.mjs"

      - name: 이전 상태 복원
        run: node "$AGENTS_DIR/runner/state.mjs" restore --site "$SITE_KEY"

      - name: 사전 점검
        id: pre
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node "$AGENTS_DIR/runner/preflight.mjs" --site "$SITE_KEY" --stage publish

      - name: 의존성 설치
        run: npm ci

      - name: 발행 후보 선정 (postgen)
        id: pick
        run: node "$AGENTS_DIR/runner/pipeline.mjs" pick --site "$SITE_KEY" --n 1 --out "$RUNNER_TEMP/picks.json"

      - name: 쓸 것이 있는지 확인
        id: has
        run: |
          n=$(node -e "console.log(require('$RUNNER_TEMP/picks.json').length)")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] || echo "::notice::집필 후보가 없습니다. 이번 회차는 발행하지 않습니다."

      - name: titlegen — 고CTR 제목 생성
        if: steps.has.outputs.count > 0
        run: node "$AGENTS_DIR/runner/pipeline.mjs" titles --site "$SITE_KEY" --from "$RUNNER_TEMP/picks.json" --out "$RUNNER_TEMP/titles.json"

      - name: linkmgr — 이 글에 붙일 링크 확보
        if: steps.has.outputs.count > 0
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node "$AGENTS_DIR/runner/pipeline.mjs" links --site "$SITE_KEY" --from "$RUNNER_TEMP/titles.json" --out "$RUNNER_TEMP/links.json"

      - name: postgen — 본문 집필
        if: steps.has.outputs.count > 0
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node "$AGENTS_DIR/runner/build-prompt.mjs" \
            --site "$SITE_KEY" --stage postgen \
            --titles "$RUNNER_TEMP/titles.json" --links "$RUNNER_TEMP/links.json" \
            --out "$RUNNER_TEMP/prompt.md"
          npx -y @anthropic-ai/claude-code@latest \
            --print "$(cat "$RUNNER_TEMP/prompt.md")" \
            --model claude-sonnet-5 \
            --permission-mode acceptEdits \
            --add-dir "$AGENTS_DIR" \
            --allowedTools "Read Edit Write Grep Glob Bash(node *) Bash(npm run *)" \
            --disallowedTools "WebFetch" \
            2>&1 | tail -40

      - name: 품질 게이트
        id: gate
        if: steps.has.outputs.count > 0
        run: node "$AGENTS_DIR/runner/quality-gate.mjs" --site "$SITE_KEY" --report "$RUNNER_TEMP/gate.json"

      - name: 타입검사
        if: steps.has.outputs.count > 0 && steps.gate.outcome == 'success'
        run: npx tsc --noEmit

      - name: 빌드
        if: steps.has.outputs.count > 0 && steps.gate.outcome == 'success'
        run: npm run build

      - name: 발행 커밋
        id: commit
        if: steps.has.outputs.count > 0 && steps.gate.outcome == 'success' && env.DRY_RUN != 'true'
        run: node "$AGENTS_DIR/runner/commit.mjs" --site "$SITE_KEY" --stage publish

      - name: 배포
        id: deploy
        if: steps.commit.outputs.published == 'true' && 'agent' == 'agent'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: 라이브 검증
        id: verify
        if: steps.commit.outputs.published == 'true'
        run: node "$AGENTS_DIR/runner/verify-live.mjs" --site "$SITE_KEY" --wait 30

      - name: 실패 시 되돌리기
        if: failure() && steps.commit.outputs.published == 'true'
        run: node "$AGENTS_DIR/runner/rollback.mjs" --site "$SITE_KEY" --sha "${{ steps.commit.outputs.sha }}"

      - name: autoindex — 색인 제출
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: node "$AGENTS_DIR/agents/autoindex/scripts/ping.mjs" --site "$SITE_KEY" --diff

      - name: 상태 저장
        if: always()
        run: node "$AGENTS_DIR/runner/state.mjs" save --site "$SITE_KEY" --commit

      - name: sitemgr — 관리 에이전트 보고
        if: always()
        run: node "$AGENTS_DIR/agents/sitemgr/scripts/sitemgr.mjs" report --site "$SITE_KEY" --issue
